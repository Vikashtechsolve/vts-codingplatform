# Snippet for nginx in front of testapi.skilltrixa.com (or any API host).
# 413 Request Entity Too Large on POST /api/vendor-admin/vendor/logo means the
# proxy limit is lower than the upload size (~4 MB). Default nginx is 1m.
#
# Include inside your server { } block for the API:
#
#   client_max_body_size 10M;
#
# Then reload: sudo nginx -t && sudo systemctl reload nginx
#
# If you use Caddy instead:
#   request_body {
#     max_size 10MB
#   }

client_max_body_size 10M;
